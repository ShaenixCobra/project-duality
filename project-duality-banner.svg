<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="leftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10141c"/>
      <stop offset="100%" stop-color="#1a2233"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050705"/>
      <stop offset="100%" stop-color="#0a120a"/>
    </linearGradient>
    <linearGradient id="seam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="leftClip"><rect x="0" y="0" width="600" height="630"/></clipPath>
    <clipPath id="rightClip"><rect x="600" y="0" width="600" height="630"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#05060a"/>

  <!-- LEFT: finance / risk side -->
  <g clip-path="url(#leftClip)">
    <rect x="0" y="0" width="600" height="630" fill="url(#leftBg)"/>
    <g stroke="#2c3550" stroke-width="1" opacity="0.55">
      <line x1="0" y1="90" x2="600" y2="90"/>
      <line x1="0" y1="180" x2="600" y2="180"/>
      <line x1="0" y1="270" x2="600" y2="270"/>
      <line x1="0" y1="360" x2="600" y2="360"/>
      <line x1="0" y1="450" x2="600" y2="450"/>
      <line x1="0" y1="540" x2="600" y2="540"/>
      <line x1="80" y1="0" x2="80" y2="630"/>
      <line x1="200" y1="0" x2="200" y2="630"/>
      <line x1="320" y1="0" x2="320" y2="630"/>
      <line x1="440" y1="0" x2="440" y2="630"/>
    </g>
    <!-- bar chart silhouette, rising toward the seam -->
    <g fill="#3b82f6" opacity="0.55">
      <rect x="90" y="500" width="34" height="90"/>
      <rect x="150" y="460" width="34" height="130"/>
      <rect x="210" y="410" width="34" height="180"/>
      <rect x="270" y="380" width="34" height="210"/>
      <rect x="330" y="330" width="34" height="260"/>
      <rect x="390" y="290" width="34" height="300"/>
      <rect x="450" y="250" width="34" height="340"/>
      <rect x="510" y="210" width="34" height="380"/>
    </g>
    <text x="60" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#9fb3d9" letter-spacing="2">RISK &amp; PRODUCT</text>
    <text x="60" y="605" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#5f7099" letter-spacing="1">IKF HOME FINANCE — 2026</text>
  </g>

  <!-- RIGHT: code / SDE side -->
  <g clip-path="url(#rightClip)">
    <rect x="600" y="0" width="600" height="630" fill="url(#rightBg)"/>
    <g font-family="Menlo, Consolas, monospace" font-size="18" fill="#1f6b3a" opacity="0.55">
      <text x="630" y="60">01001</text>
      <text x="760" y="100">&lt;div&gt;</text>
      <text x="870" y="150">function()</text>
      <text x="650" y="200">import numpy</text>
      <text x="900" y="240">{ return }</text>
      <text x="700" y="290">const x =</text>
      <text x="830" y="330">SELECT *</text>
      <text x="650" y="380">while(true)</text>
      <text x="920" y="420">git commit</text>
      <text x="700" y="470">torch.nn</text>
      <text x="850" y="520">== target</text>
      <text x="650" y="565">01101</text>
    </g>
    <!-- ascending code-path line, mirrors the bar chart's rise -->
    <polyline points="630,590 690,520 750,470 810,400 870,340 930,280 990,220 1050,160 1110,110"
      fill="none" stroke="#22c55e" stroke-width="3" filter="url(#glow)" opacity="0.9"/>
    <text x="1140" y="60" font-family="Menlo, Consolas, monospace" font-size="24" fill="#4ade80" letter-spacing="1" text-anchor="end">SDE / SWE</text>
    <text x="1140" y="605" font-family="Menlo, Consolas, monospace" font-size="14" fill="#2f7a4a" letter-spacing="1" text-anchor="end">MAANG → NVIDIA / ANTHROPIC</text>
  </g>

  <!-- seam -->
  <rect x="596" y="0" width="8" height="630" fill="url(#seam)" opacity="0.85"/>

  <!-- title -->
  <g text-anchor="middle">
    <rect x="430" y="270" width="340" height="90" fill="#05060a" opacity="0.55" rx="6"/>
    <text x="600" y="305" font-family="Georgia, serif" font-size="34" fill="#dbe6ff">
      <tspan fill="#c9d6f5">project</tspan><tspan fill="#4ade80" font-family="Menlo, Consolas, monospace">-duality</tspan>
    </text>
    <text x="600" y="335" font-family="Menlo, Consolas, monospace" font-size="14" fill="#8aa0c9" letter-spacing="1">one role. two directions. one trajectory.</text>
  </g>
</svg>
